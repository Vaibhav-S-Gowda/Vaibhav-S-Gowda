
name: Grow My Bonsai

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate animated bonsai
        uses: egorthinks/git-bonsai@v1
        with:
          user: Vaibhav-S-Gowda
          output-dir: output
          commit: true
